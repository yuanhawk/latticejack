name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    name: build + verify (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    # Only meaningful for the self-hosted leg: that runner lives on an Azure
    # VM stopped between uses (cost control) rather than left running, so a
    # push while it's off would otherwise queue for hours waiting for a
    # runner that isn't coming - fail fast instead of hanging.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Required gate: always-available GitHub-hosted x86_64 runner.
          - runner: ubuntu-latest
            label: ubuntu-latest
            required: true
          # Bonus, non-blocking: the actual target hardware
          # (arm-hackathon-plan.md) - an Azure Cobalt 100 (Neoverse-N2) VM,
          # registered as a self-hosted runner (see docs/arm64-instance-setup.md).
          # Not required because the VM is intentionally stopped between
          # uses to control cost, so it won't always be online - a failure
          # here shouldn't redden the whole pipeline, but a pass is genuine
          # proof this runs on the real target Arm64 silicon, not a generic
          # hosted Arm64 runner.
          - runner: [self-hosted, ARM64, azure]
            label: self-hosted-azure-cobalt100
            required: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Confirm architecture
        run: uname -m

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-${{ runner.arch }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-m2-

      - name: Build
        run: mvn -q -DskipTests package

      - name: Classical mTLS baseline (before)
        run: ./run before

      - name: Hybrid PQC key exchange (after) - fails if hybrid group doesn't actually negotiate
        run: ./run after
