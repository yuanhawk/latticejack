name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    name: build + verify (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Required gate: always-available x86_64 runner.
          - runner: ubuntu-latest
            required: true
          # Bonus, non-blocking: GitHub-hosted Arm64 runner, matching this
          # project's actual target platform (arm-hackathon-plan.md). Not
          # required because Arm64 hosted-runner availability/quota can
          # vary by plan on a private repo - a failure here shouldn't
          # redden the whole pipeline, but a pass is genuine proof this
          # runs on Arm64, not just x86.
          - runner: ubuntu-24.04-arm
            required: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Confirm architecture
        run: uname -m

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-${{ runner.arch }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-m2-

      - name: Build
        run: mvn -q -DskipTests package

      - name: Classical mTLS baseline (before)
        run: ./run before

      - name: Hybrid PQC key exchange (after) - fails if hybrid group doesn't actually negotiate
        run: ./run after
