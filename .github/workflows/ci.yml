name: CI

# Disabled from automatic triggers (push/pull_request) now that this repo is
# public. The self-hosted-runner leg below (this project's own Azure VM,
# see docs/arm64-instance-setup.md) is exactly the configuration GitHub
# warns against on public repos: for `pull_request`, Actions runs the
# workflow file FROM the incoming PR, not the base branch's version - so
# any external contributor could submit a PR that edits this file to run
# arbitrary code on that self-hosted runner (real infrastructure, real
# Azure credentials reachable from it). workflow_dispatch-only means CI
# only ever runs when someone with write access to this repo triggers it
# manually (Actions tab / `gh workflow run ci.yml`) - no public attack
# surface, self-hosted leg included. Re-enable `push`/`pull_request` only
# if the self-hosted matrix entry below is removed first, or restricted to
# `push` (requires write access) rather than `pull_request`.
on:
  workflow_dispatch: {}

jobs:
  build-and-verify:
    name: build + verify (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    # Only meaningful for the self-hosted leg: that runner lives on an Azure
    # VM stopped between uses (cost control) rather than left running, so a
    # push while it's off would otherwise queue for hours waiting for a
    # runner that isn't coming - fail fast instead of hanging.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Required gate: always-available GitHub-hosted x86_64 runner.
          - runner: ubuntu-latest
            label: ubuntu-latest
            required: true
          # Bonus, non-blocking: the actual target hardware
          # (arm-hackathon-plan.md) - an Azure Cobalt 100 (Neoverse-N2) VM,
          # registered as a self-hosted runner (see docs/arm64-instance-setup.md).
          # Not required because the VM is intentionally stopped between
          # uses to control cost, so it won't always be online - a failure
          # here shouldn't redden the whole pipeline, but a pass is genuine
          # proof this runs on the real target Arm64 silicon, not a generic
          # hosted Arm64 runner.
          - runner: [self-hosted, ARM64, azure]
            label: self-hosted-azure-cobalt100
            required: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Confirm architecture
        run: uname -m

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-${{ runner.arch }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-m2-

      - name: Unit tests
        # This project had zero automated tests until an independent audit
        # flagged it (mvn test had nothing to run, so build used
        # -DskipTests unconditionally). These two suites are pure Java/BC,
        # no native library and no live TLS handshake required, so they run
        # on every runner in this matrix unconditionally - the FFM-backed
        # nativekem classes still aren't covered here on purpose (they
        # require -Dlatticejack.nativekem.lib pointing at a built
        # libmlkem768ffm.{dylib,so}, which this CI environment doesn't
        # provision), that gap is what ./run-nativekem.sh below still
        # covers end-to-end instead.
        run: mvn -q test

      - name: Build
        run: mvn -q -DskipTests package

      - name: Classical mTLS baseline (before)
        run: ./run before

      - name: Hybrid PQC key exchange (after) - fails if hybrid group doesn't actually negotiate
        run: ./run after
